<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Green Streak Challenge</title>

https://cdn.tailwindcss.comscript>

<style>
body{
background:#166534;
font-family:sans-serif;
}

.fade{
transition:.3s;
}

.tab{
display:none;
}

.tab.active{
display:block;
}
</style>

</head>

<body>

<div class="max-w-md mx-auto min-h-screen bg-green-700 text-white">

<!-- HEADER -->

<div class="p-4">

<h1 class="text-center text-3xl font-bold">
🌱 Green Streak
</h1>

<div class="mt-4 bg-green-900 rounded-full h-4">

<div
id="progressBar"
class="bg-white h-4 rounded-full"
style="width:0%">
</div>

</div>

</div>

<!-- NAVIGATION -->

<div class="grid grid-cols-4 text-center pb-3 border-b">

<button onclick="showTab('missions')">
🎯
</button>

<button onclick="showTab('leaderboard')">
🏆
</button>

<button onclick="showTab('profile')">
👤
</button>

<button onclick="showTab('admin')">
⚙️
</button>

</div>

<!-- MISSIONS -->

<div id="missions" class="tab active p-4">

<h2 class="font-bold text-xl">
Nhiệm vụ hôm nay
</h2>

<div id="missionList"></div>

</div>

<!-- LEADERBOARD -->

<div id="leaderboard" class="tab p-4">

<h2 class="font-bold text-xl">
🏆 Bảng xếp hạng
</h2>

<div id="leaderboardList"></div>

</div>

<!-- PROFILE -->

<div id="profile" class="tab p-4">

<div class="flex flex-col items-center">

https://placehold.co/100

<input
type="file"
accept="image/*"
class="mt-3"
onchange="uploadAvatar(event)"
>

<input
id="nickname"
class="mt-3 p-2 rounded text-black w-full"
placeholder="Tên hiển thị"
/>

<div id="pointDisplay"
class="mt-4 text-2xl">
⭐ 0
</div>

</div>

</div>

<!-- ADMIN -->

<div id="admin" class="tab p-4">

<h2 class="font-bold text-2xl">
Admin Panel
</h2>

<div id="pendingContainer"></div>

</div>

</div>

<script>

const missions = [

{
id:1,
name:"Chiến thần rút chốt",
points:20
},

{
id:2,
name:"Phong ấn lôi thần",
points:10
},

{
id:3,
name:"Thực thần càng quét",
points:10
},

{
id:4,
name:"Thủy bình độc bản",
points:30
},

{
id:5,
name:"Căng hải vào việc",
points:20
},

{
id:6,
name:"Túi/Balo vạn năng",
points:30
},

{
id:7,
name:"Khai mở phong môn",
points:10
},

{
id:8,
name:"Cấp thủy dưỡng mộc",
points:10
},

{
id:9,
name:"Thanh trừng rác thải",
points:10
},

{
id:10,
name:"Độ lại đồ phế",
points:50
}

];

let score = 0;

function showTab(tabName){

document
.querySelectorAll(".tab")
.forEach(tab=>{

tab.classList.remove("active");

});

document
.getElementById(tabName)
.classList.add("active");

}

function renderMissions(){

const container =
document.getElementById("missionList");

container.innerHTML="";

missions.forEach(m=>{

container.innerHTML += `

<div class="bg-white text-black p-3 rounded-xl mt-3">

<h3 class="font-bold">
${m.name}
</h3>

<p>${m.points} điểm</p>

<input
type="file"
class="mt-2"
accept="image/*,video/*"
onchange="submitMission(${m.id},${m.points})"
/>

</div>

`;

});

}

function submitMission(id,points){

alert(
"Nhiệm vụ đã gửi duyệt!"
);

const pending =
document.getElementById(
"pendingContainer"
);

pending.innerHTML += `

<div class="bg-white text-black p-3 rounded mt-3">

Nhiệm vụ ${id}

<button
onclick="approve(${points})"
class="bg-green-600 text-white px-3 py-1 rounded ml-2">

Duyệt

</button>

</div>

`;

}

function approve(points){

score += points;

document
.getElementById("pointDisplay")
.innerHTML =
`⭐ ${score}`;

updateProgress();

alert("Đã duyệt");

}

function updateProgress(){

const percent =
Math.min((score/200)*100,100);

document
.getElementById("progressBar")
.style.width =
percent+"%";

}

function uploadAvatar(event){

const file =
event.target.files[0];

if(file){

document
.getElementById(
"avatarPreview"
)
.src =
URL.createObjectURL(file);

}

}

renderMissions();

</script>

</body>
</html>
